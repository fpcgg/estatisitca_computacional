# Define o nome do workflow.
name: Deploy Quarto e Upload para Google Drive

# Aciona o workflow em cada push para a branch 'main'.
on:
  push:
    branches: main

# Agrupa os trabalhos a serem executados.
jobs:
  build-and-deploy:
    # O job será executado em uma máquina virtual Ubuntu.
    runs-on: ubuntu-latest

    # Define a sequência de passos do job.
    steps:
      # --- PASSO 1: PREPARAÇÃO DO AMBIENTE ---
      - name: Fazer checkout do código do repositório
        uses: actions/checkout@v4

      # --- PASSO 2: CONFIGURAÇÃO E PUBLICAÇÃO DO QUARTO ---
      - name: Configurar o ambiente do Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publicar o projeto no Quarto Pub
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          # O nome correto para o token de autenticação do Quarto Pub.
          QUARTO_PUB_AUTH_TOKEN: ${{ secrets.QUARTO_PUB_AUTH_TOKEN }}

      # --- PASSO 3: UPLOAD DE TODOS OS ARQUIVOS PARA O GOOGLE DRIVE ---
      # Este passo se conecta ao Google Drive e envia o conteúdo completo do repositório.
      - name: Fazer o upload de todos os arquivos do repositório para o Google Drive
        uses: Jumbo810/Upload_Github_Artifacts_TO_GDrive@v2.2.2
        with:
          # O caminho para o conteúdo que você deseja enviar.
          # './' representa o diretório raiz do repositório, ou seja, todos os arquivos.
          target: './'

          # O ID da pasta principal no Google Drive onde a subpasta será criada.
          parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}

          # As credenciais da sua conta de serviço do Google Cloud (em Base64).
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}

          # (Opcional, mas MUITO recomendado) Cria uma subpasta dentro da 'parent_folder_id'.
          # Usar o SHA do commit garante que cada push crie uma pasta única, mantendo um histórico organizado.
          # Por exemplo, uma pasta chamada 'commit-a1b2c3d4e5f6' será criada.
          child_folder: 'commit-${{ github.sha }}'