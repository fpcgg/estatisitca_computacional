# Define o nome do workflow.
name: Deploy Quarto e Upload para Google Drive

# Aciona o workflow em cada push para a branch 'main'.
on:
  push:
    branches: main

# Agrupa os trabalhos a serem executados.
jobs:
  build-and-deploy:
    # O job será executado em uma máquina virtual Ubuntu.
    runs-on: ubuntu-latest

    # Define a sequência de passos do job.
    steps:
      # --- PASSO 1: PREPARAÇÃO DO AMBIENTE ---
      - name: Fazer checkout do código do repositório
        uses: actions/checkout@v4

      # Instala o R na máquina virtual para que o Quarto possa executar scripts R.
      - name: Instalar o R
        uses: r-lib/actions/setup-r@v2
        with:
          # Você pode especificar uma versão do R ('4.3', '4.2.2') ou usar 'latest'.
          r-version: 'latest'
      
      # Instalar pacotes do R necessários para o Quarto.
      - name: Instalar dependências do R
        run: |
          install.packages(c("ggplot2", "dplyr", "plotly", "patchwork", "fitdistrplus"))
        shell: Rscript {0}

      # --- PASSO 2: CONFIGURAÇÃO E PUBLICAÇÃO DO QUARTO ---
      - name: Configurar o ambiente do Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Este passo agora funcionará, pois o R está disponível.
      - name: Publicar o projeto no Quarto Pub
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          QUARTO_PUB_AUTH_TOKEN: ${{ secrets.QUARTO_PUB_AUTH_TOKEN }}

      # --- PASSO 3: UPLOAD DE TODOS OS ARQUIVOS PARA O GOOGLE DRIVE ---
      - name: Fazer o upload de todos os arquivos do repositório para o Google Drive
        uses: Jumbo810/Upload_Github_Artifacts_TO_GDrive@v2.2.2
        with:
          target: './'
          parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          child_folder: 'commit-${{ github.sha }}'