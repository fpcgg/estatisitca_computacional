name: Deploy Quarto e Upload para Google Drive

# Dispara o workflow apenas quando houver push na branch main
# E somente se os arquivos modificados forem relevantes para o site
on:
  push:
    branches:
      - main
    paths:
      - '**.qmd'       # Arquivos Quarto
      - '**.Rmd'       # Arquivos RMarkdown
      - '**.R'         # Scripts R
      - '**.css'       # Estilos
      - '**.js'        # Scripts JS
      - '**.png'       # Imagens
      - '**.jpg'
      - '**.jpeg'
      - '**.gif'
      - '**.svg'
      - '_quarto.yml'  # Arquivo de configuração do Quarto
      - '**.yml'       # Arquivos YAML de configuração
      - '!README.md'   # Ignora mudanças só no README

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Baixar o código do repositório
      - name: Fazer checkout do código do repositório
        uses: actions/checkout@v4

      # 2️⃣ Instalar o R na versão mais recente
      - name: Instalar o R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'latest'
          use-public-rspm: true

      # 3️⃣ Instalar pacotes necessários do R (incluindo plotly e dependências HTML)
      - name: Instalar dependências do R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          packages: |
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::ggplot2
            any::dplyr
            any::htmlwidgets
            any::htmltools
            any::plotly
            any::tidyverse

      # 4️⃣ (Opcional) Mostrar pacotes instalados para debug
      - name: Verificar pacotes instalados
        run: |
          R -e "installed.packages()[, c('Package', 'Version')]"

      # 5️⃣ Configurar o Quarto
      - name: Configurar o ambiente do Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # 6️⃣ Atualizar o Quarto
      - name: Atualizar o Quarto
        run: quarto update

      # 7️⃣ Renderizar o site
      - name: Renderizar o projeto Quarto
        run: quarto render --to html

      # 8️⃣ Publicar no Quarto Pub
      - name: Publicar no Quarto Pub
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          QUARTO_PUB_AUTH_TOKEN: ${{ secrets.QUARTO_PUB_AUTH_TOKEN }}
