# Define o nome do workflow.
name: Deploy Quarto e Upload para Google Drive

# Aciona o workflow em cada push para a branch 'main'.
on:
  push:
    branches: main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do código do repositório
        uses: actions/checkout@v4

      # --- OTIMIZAÇÃO 1: USAR PACOTES BINÁRIOS ---
      # Configura o R para usar o RStudio Package Manager, que acelera a instalação.
      - name: Instalar o R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'latest'
          use-public-rspm: true # Esta linha ativa o uso de binários!

      # --- OTIMIZAÇÃO 2: INSTALAR DEPENDÊNCIAS COM CACHE ---
      # Este passo instala os pacotes necessários e armazena o resultado em cache
      # para as próximas execuções.
      - name: Instalar dependências do R (com cache)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::dplyr
            any::fitdistrplus
            any::patchwork
            any::plotly
            any::htmlwidgets 

      - name: Configurar o ambiente do Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publicar o projeto no Quarto Pub
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          QUARTO_PUB_AUTH_TOKEN: ${{ secrets.QUARTO_PUB_AUTH_TOKEN }}

      - name: Fazer o upload de todos os arquivos do repositório para o Google Drive
        uses: Jumbo810/Upload_Github_Artifacts_TO_GDrive@v2.2.2
        with:
          target: './'
          parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          child_folder: 'commit-${{ github.sha }}'