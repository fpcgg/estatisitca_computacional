# Define o nome do workflow.
name: Deploy Quarto e Upload para Google Drive

# Aciona o workflow em cada push para a branch 'main'.
on:
  push:
    branches: main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do código do repositório
        uses: actions/checkout@v4

      # Instala o R e as dependências com cache e binários
      - name: Instalar o R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'latest'
          use-public-rspm: true

      - name: Instalar dependências do R (com cache)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # ADICIONADO para forçar a recriação do cache de pacotes.
          # Se o erro persistir, mude o número para 2, 3, etc.
          cache-version: 1
          
          # GARANTA QUE A LISTA DE PACOTES ESTEJA COMPLETA
          packages: |
            any::knitr
            any::rmarkdown
            any::downlit
            any::xml2
            any::ggplot2
            any::dplyr
            any::htmlwidgets  

      # Passos do Quarto
      - name: Configurar o ambiente do Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publicar o projeto no Quarto Pub
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          QUARTO_PUB_AUTH_TOKEN: ${{ secrets.QUARTO_PUB_AUTH_TOKEN }}

      # Compacta e faz upload do repositório para o Drive
      - name: Compactar todo o repositório em um arquivo
        run: zip -r repository-archive.zip .

      - name: Fazer o upload do arquivo compactado para o Google Drive
        uses: Jumbo810/Upload_Github_Artifacts_TO_GDrive@v2.2.2
        with:
          target: 'repository-archive.zip'
          parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          name: 'commit-${{ github.sha }}.zip'

